name: K_desk quality

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-verification:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -e ".[dev]"
      - name: Verify change
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -NonInteractive -File scripts\verify_change.ps1 -Mode Full -Base '${{ github.event.before }}'
      - name: Upload generated contracts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-contracts
          path: |
            docs/feature-registry.json
            docs/openapi/*.json
